document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"adcbd13e-3f6d-4960-810d-460a4951bff7\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"doc\">\n<style>\n@font-face { font-family: 'Asap Condensed'; font-weight: 400; src: url(\"15b296a5-3e9d-4824-87d0-dafa827a94e6\") format('truetype'); }\n@font-face { font-family: 'Asap Condensed'; font-weight: 500; src: url(\"68efb42b-47d3-4049-a5e4-e595650926a2\") format('truetype'); }\n@font-face { font-family: 'Asap Condensed'; font-weight: 600; src: url(\"68efb42b-47d3-4049-a5e4-e595650926a2\") format('truetype'); }\n@font-face { font-family: 'Open Sans'; font-weight: 300; src: url(\"fd07dae0-6c6d-47a9-9907-733051c05551\") format('truetype'); }\n@font-face { font-family: 'Open Sans'; font-weight: 400; src: url(\"e8eee218-637d-4a3d-9c0d-e605dfa2d083\") format('truetype'); }\n@font-face { font-family: 'Open Sans'; font-weight: 600; src: url(\"73e5cace-578c-4498-b4ca-a4b14549449a\") format('truetype'); }\n@font-face { font-family: 'Open Sans'; font-weight: 700; src: url(\"ed6f2428-1d36-48c7-ae8f-063c2d0f9516\") format('truetype'); }\ndoc-page:not(:defined) { visibility: hidden; }\nh1, h2, h3, h4, p, ul, li { margin: 0; padding: 0; }\n* { box-sizing: border-box; }\n.page > * { flex-shrink: 0; }\na { color: #C25E17; text-decoration: none; }\na:hover { color: #28366D; }\n<\u002Fstyle>\n<script src=\"e7d6fcc4-b6d7-4177-97c3-cf9a55a0439e\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page size=\"letter\">\n\n<section class=\"page\" data-screen-label=\"Page 1\" style=\"padding: 0.3in 0.4in 0.26in; display: flex; flex-direction: column; background: #fff; font-family: 'Open Sans', sans-serif; color: #000; -webkit-font-smoothing: antialiased;\">\n\n  <header style=\"background: #28366D; padding: 0.11in 0.26in; display: flex; align-items: center; justify-content: space-between; gap: 0.26in;\">\n    <div style=\"flex: 1; min-width: 0;\">\n      <div style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10pt; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #F0B183; margin-bottom: 1.2mm;\">BRIEFING NOTE<\u002Fdiv>\n      <h1 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 20pt; font-weight: 600; color: #fff; line-height: 1.04; letter-spacing: 0.005em; margin-bottom: 1.2mm;\">Global AI Adoption Index<\u002Fh1>\n      <p style=\"font-size: 10.5pt; font-weight: 400; line-height: 1.34; color: #E4E8F2;\"><b style=\"color: #F0B183;\">Tracking AI adoption and the conditions that drive it<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n    <img src=\"9745a8f9-328f-4b5f-a96b-240943fa2261\" alt=\"Development Data Partnership\" style=\"height: 0.66in; width: auto; flex-shrink: 0;\">\n  <\u002Fheader>\n\n  <div style=\"display: flex; height: 4px; margin-bottom: 0.1in;\">\n    <span style=\"flex: 0 0 34%; background: #3EACAD;\"><\u002Fspan>\n    <span style=\"flex: 0 0 14%; background: #DC6D25;\"><\u002Fspan>\n    <span style=\"flex: 1; background: #E7E9EF;\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; align-self: flex-start; padding-bottom: 1.2mm; margin-bottom: 2.1mm;\">What and Why<\u002Fh2>\n  <p style=\"font-size: 10.5pt; line-height: 1.42; color: #000; margin-bottom: 2mm; text-wrap: pretty;\">AI is diffusing rapidly, and governments and multilateral institutions are directing billions toward digital infrastructure, skills programs, and labor policy. But they are acting with limited evidence on how AI adoption varies across countries and sectors.<\u002Fp>\n  <p style=\"font-size: 10.5pt; line-height: 1.42; color: #000; margin-bottom: 0.105in; text-wrap: pretty;\">The Global AI Adoption Index is a joint initiative of intergovernmental organizations, including the World Bank Group, IMF, and OECD, and leading AI companies — including Anthropic, Google, Microsoft, OpenAI, and OpenRouter — who share their own usage data. Unlike measures built on surveys or proxies, the Index draws directly on this data to track consumer chat activity and API usage across countries, normalized against population, income, connectivity, and other national baselines. These usage indicators are supplemented with measures of the conditions that shape adoption, including digital infrastructure, labor markets, and languages, drawing on complementary data from partners including Meta and LinkedIn.<\u002Fp>\n\n  <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; align-self: flex-start; padding-bottom: 1.2mm; margin-bottom: 2.1mm;\">What We Are Building Towards<\u002Fh2>\n  <div style=\"background: #F4F6FB; border-radius: 3px; padding: 2.6mm 4.4mm; margin-bottom: 0.1in; display: grid; grid-template-columns: 1.26fr 0.82fr 1.02fr; gap: 0.22in; align-items: start;\">\n    <div style=\"display: flex; gap: 3.4mm; align-items: flex-start;\">\n      <span style=\"flex: 0 0 auto; font-family: 'Asap Condensed', sans-serif; font-size: 15pt; font-weight: 600; color: #DC6D25; line-height: 1.1;\">1<\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">Establish the <strong style=\"color: #28366D; font-weight: 700;\">first harmonized, multi-company measurement system<\u002Fstrong> for global generative AI adoption, launched at the 2027 Global AI Summit.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm; align-items: flex-start; border-left: 1px solid #DDE2ED; padding-left: 0.22in;\">\n      <span style=\"flex: 0 0 auto; font-family: 'Asap Condensed', sans-serif; font-size: 15pt; font-weight: 600; color: #DC6D25; line-height: 1.1;\">2<\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">Ensure the system is <strong style=\"color: #28366D; font-weight: 700;\">demand-driven and policy-relevant<\u002Fstrong> to project stakeholders.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm; align-items: flex-start; border-left: 1px solid #DDE2ED; padding-left: 0.22in;\">\n      <span style=\"flex: 0 0 auto; font-family: 'Asap Condensed', sans-serif; font-size: 15pt; font-weight: 600; color: #DC6D25; line-height: 1.1;\">3<\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">Build <strong style=\"color: #28366D; font-weight: 700;\">coalition and infrastructure durable enough<\u002Fstrong> to persist beyond the 2027 publication as recurring statistical output.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 0.32in; margin-bottom: 0.105in;\">\n    <div style=\"flex: 1; min-width: 0;\">\n      <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; align-self: flex-start; padding-bottom: 1.2mm; margin-bottom: 2.1mm; display: table;\">The Challenge<\u002Fh2>\n      <p style=\"font-size: 10.5pt; line-height: 1.42; color: #000; margin-bottom: 2mm; text-wrap: pretty;\">Every major AI company holds a piece of this picture in its own usage logs, but no single company can see the whole, and none has an incentive to open its logs to a competitor.<\u002Fp>\n      <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">Turning proprietary data from competing companies into one shared, comparable public good has not been attempted at this scale before.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-width: 0; padding-left: 0.32in;\">\n      <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; align-self: flex-start; padding-bottom: 1.2mm; margin-bottom: 2.1mm; display: table;\">DDP's Role<\u002Fh2>\n      <p style=\"font-size: 10.5pt; line-height: 1.42; color: #000; margin-bottom: 2mm; text-wrap: pretty;\">The Development Data Partnership (datapartnership.org) is a consortium of 12 international organizations and more than 30 tech companies. DDP has an 8-year track record of facilitating private data sharing for public good, from social media to satellite imagery providers.<\u002Fp>\n      <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">This project applies that same experience: privacy-preserving aggregation pipelines, data-sharing agreements that protect commercial sensitivity, and a participatory governance structure.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; align-self: flex-start; padding-bottom: 1.2mm; margin-bottom: 2.1mm;\">Who Can Use It &nbsp;and How<\u002Fh2>\n  <div style=\"display: flex; flex-direction: column; gap: 2mm;\">\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #DC6D25; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">Government agencies<\u002Fstrong> — benchmark national AI adoption and target digital-economy investment.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #DC6D25; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">Intergovernmental organizations<\u002Fstrong> — direct technical assistance and lending toward measurable adoption gaps; evidence-informed AI policy and regulatory advisory.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #DC6D25; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">National statistical offices<\u002Fstrong> — build AI activity into labor market, productivity, and national accounts statistics.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #DC6D25; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">Civil society and researchers<\u002Fstrong> — leverage a common foundational dataset for advocacy and research.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #DC6D25; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">Companies<\u002Fstrong> — evaluate market, localization, and infrastructure priorities.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Page 2\" style=\"padding: 0.3in 0.4in 0.26in; display: flex; flex-direction: column; background: #fff; font-family: 'Open Sans', sans-serif; color: #000; -webkit-font-smoothing: antialiased;\">\n\n  <div style=\"display: flex; height: 4px; margin-bottom: 0.1in;\">\n    <span style=\"flex: 0 0 34%; background: #3EACAD;\"><\u002Fspan>\n    <span style=\"flex: 0 0 14%; background: #DC6D25;\"><\u002Fspan>\n    <span style=\"flex: 1; background: #E7E9EF;\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; align-self: flex-start; padding-bottom: 1.2mm; margin-bottom: 2.6mm;\">What We Measure as Quarterly Indices<\u002Fh2>\n  <div style=\"display: flex; flex-direction: column; gap: 3mm; margin-bottom: 2.15mm;\">\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #3EACAD; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.46; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">Consumer chat intensity and diffusion<\u002Fstrong> — quarterly measures of adoption, by country<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #3EACAD; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.46; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">Consumer chat<\u002Fstrong> — harmonized sampling and taxonomy approaches across companies for analyzing how people use AI, by country<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #3EACAD; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.46; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">API token intensity<\u002Fstrong> — quarterly measure of use, by country<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 3.4mm;\">\n      <span style=\"flex: 0 0 7px; height: 7px; border-radius: 50%; background: #3EACAD; margin-top: 6.5px;\"><\u002Fspan>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.46; color: #000; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">API users and use metrics<\u002Fstrong> — harmonized approach across companies for understanding model choices and industries (tbc)<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background: #F1F8F8; border-left: 4px solid #3EACAD; border-radius: 3px; padding: 4.2mm 4.6mm; font-size: 10.5pt; line-height: 1.4; color: #000; margin-bottom: 0.125in; text-wrap: pretty;\">Every indicator is normalized across a range of bases — population, GDP, GDP per capita, internet-connected population, working-age population, and median wage, among others.<\u002Fdiv>\n\n  <div style=\"display: flex; gap: 0.32in; margin-bottom: 0.125in;\">\n    <div style=\"flex: 1.04; min-width: 0;\">\n      <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; padding-bottom: 1.2mm; margin-bottom: 2.1mm; display: table;\">Path to Publication<\u002Fh2>\n      <div style=\"border-left: 2px solid #E0E4EE; padding-left: 4.8mm; display: flex; flex-direction: column; gap: 4mm;\">\n        <div style=\"position: relative;\">\n          <span style=\"position: absolute; left: -6.4mm; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #B9BECC;\"><\u002Fspan>\n          <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000;\"><strong style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11pt; font-weight: 600; color: #28366D; letter-spacing: 0.02em;\">Jun 2025<\u002Fstrong> &nbsp;First Roundtable convened<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative;\">\n          <span style=\"position: absolute; left: -6.4mm; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #B9BECC;\"><\u002Fspan>\n          <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000;\"><strong style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11pt; font-weight: 600; color: #28366D; letter-spacing: 0.02em;\">Nov 2025<\u002Fstrong> &nbsp;Technical Committee formed<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative;\">\n          <span style=\"position: absolute; left: -6.4mm; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #B9BECC;\"><\u002Fspan>\n          <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000;\"><strong style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11pt; font-weight: 600; color: #28366D; letter-spacing: 0.02em;\">Apr 2026<\u002Fstrong> &nbsp;Spring Meetings Roundtable<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative;\">\n          <span style=\"position: absolute; left: -7.1mm; top: 4.4px; width: 11px; height: 11px; border-radius: 50%; background: #DC6D25; box-shadow: 0 0 0 3px rgba(220,109,37,0.2);\"><\u002Fspan>\n          <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000;\"><strong style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11pt; font-weight: 600; color: #C25E17; letter-spacing: 0.02em;\">Sep 2026<\u002Fstrong> &nbsp;<strong style=\"font-weight: 700;\">LSE Forum — public introduction<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative;\">\n          <span style=\"position: absolute; left: -6.4mm; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #B9BECC;\"><\u002Fspan>\n          <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000;\"><strong style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11pt; font-weight: 600; color: #28366D; letter-spacing: 0.02em;\">Oct 2026<\u002Fstrong> &nbsp;Additional companies invited; Roundtable finalizes research agenda based on stakeholder consultation outcomes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative;\">\n          <span style=\"position: absolute; left: -6.4mm; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #B9BECC;\"><\u002Fspan>\n          <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000;\"><strong style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11pt; font-weight: 600; color: #28366D; letter-spacing: 0.02em;\">Apr 2027<\u002Fstrong> &nbsp;Roundtable approves first iteration<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative;\">\n          <span style=\"position: absolute; left: -6.4mm; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #B9BECC;\"><\u002Fspan>\n          <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000;\"><strong style=\"font-family: &quot;Asap Condensed&quot;, sans-serif; font-size: 11pt; font-weight: 600; color: rgb(40, 54, 109); letter-spacing: 0.02em;\">Jun 2027<\u002Fstrong> &nbsp;Global AI Summit — formal launch and joint publication of first quarterly indicators<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-width: 0; padding-left: 0.32in;\">\n      <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; padding-bottom: 1.2mm; margin-bottom: 2.1mm; display: table;\">The Coalition<\u002Fh2>\n      <h3 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #3EACAD; margin-bottom: 1.6mm;\">International Organizations<\u002Fh3>\n      <p style=\"font-size: 10.5pt; line-height: 1.4; color: #000; margin-bottom: 2.4mm; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">Publication Oversight - Chief Statisticians:<\u002Fstrong> <strong style=\"color: #DC6D25; font-weight: 700;\">World Bank Group<\u002Fstrong> (Haishan Fu) · <strong style=\"color: #DC6D25; font-weight: 700;\">IMF<\u002Fstrong> (Bert Kroese) · <strong style=\"color: #DC6D25; font-weight: 700;\">OECD<\u002Fstrong> (Steve MacFeely)<\u002Fp>\n      <p style=\"font-size: 10.5pt; line-height: 1.4; color: #000; margin-bottom: 2.2mm; text-wrap: pretty;\"><strong style=\"color: #28366D; font-weight: 700;\">Contributing DDP Members:<\u002Fstrong><\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 2mm; margin-bottom: 4mm;\">\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">ADB<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">AfDB<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">EBRD<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">CAF<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">IDB<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">IDB Invest<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">UNDP<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">UNICEF<\u002Fspan>\n      <\u002Fdiv>\n      <h3 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #3EACAD; margin-bottom: 2.2mm;\">Tech Company Commitment Signatories<\u002Fh3>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 2mm; margin-bottom: 4mm;\">\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">Anthropic<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">Google<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">Meta<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">Microsoft<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">OpenAI<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">GitHub<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">LinkedIn<\u002Fspan>\n        <span style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 500; color: #28366D; background: #F4F6FB; border: 1px solid #E0E4EE; border-radius: 100px; padding: 1mm 2.8mm;\">OpenRouter<\u002Fspan>\n      <\u002Fdiv>\n      <h3 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #3EACAD; margin-bottom: 1.6mm;\">In Discussion<\u002Fh3>\n      <p style=\"font-size: 10.5pt; line-height: 1.46; color: #000; text-wrap: pretty;\">Additional companies operating in different countries are in active discussion.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showExpansion }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <h2 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 14.5pt; font-weight: 600; color: #28366D; border-bottom: 2px solid #3EACAD; padding-bottom: 1.2mm; margin-bottom: 2.1mm; display: table;\">Additional Components<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 1.12fr 0.96fr 0.92fr; gap: 0.18in;\">\n      <div style=\"background: #F4F6FB; border-top: 3px solid #3EACAD; border-radius: 0 0 3px 3px; padding: 3mm 3.8mm;\">\n        <h4 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11.5pt; font-weight: 600; color: #28366D; margin-bottom: 1.2mm;\">US AI Adoption Index<\u002Fh4>\n        <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">State-level indicators launching alongside the global index, informed by labour and education stakeholder consultations led by the Partnership on AI.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #F4F6FB; border-top: 3px solid #3EACAD; border-radius: 0 0 3px 3px; padding: 3mm 3.8mm;\">\n        <h4 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11.5pt; font-weight: 600; color: #28366D; margin-bottom: 1.2mm;\">Supplementary datasets<\u002Fh4>\n        <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">A research program with LinkedIn, Meta, Ookla, and others building complementary datasets beyond chat and API data.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #F4F6FB; border-top: 3px solid #3EACAD; border-radius: 0 0 3px 3px; padding: 3mm 3.8mm;\">\n        <h4 style=\"font-family: 'Asap Condensed', sans-serif; font-size: 11.5pt; font-weight: 600; color: #28366D; margin-bottom: 1.2mm;\">Low-resource language index<\u002Fh4>\n        <p style=\"font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">Accounting for new open-source datasets and audio/voice data, not just web crawl.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"margin-top: auto; padding-top: 0.125in;\">\n    <sc-if value=\"{{ showConfidential }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"border-top: 2px solid #28366D; padding-top: 3.2mm; display: flex; gap: 0.3in; align-items: baseline;\">\n      <h3 style=\"flex: 0 0 auto; font-family: 'Asap Condensed', sans-serif; font-size: 10.5pt; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #3EACAD;\">Support<\u002Fh3>\n      <p style=\"flex: 1; font-size: 10.5pt; line-height: 1.44; color: #000; text-wrap: pretty;\">Program grant funding provided by the Gates Foundation and Schmidt Sciences. Analytical work and global stakeholder inputs contributed by DDP member intergovernmental organizations. US-based stakeholder engagement led by Partnership on AI.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Ffooter>\n\n<\u002Fsection>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showConfidential&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showExpansion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const nudge = () => {\n      const dp = document.querySelector('doc-page');\n      if (!dp) return;\n      dp._raf = null;\n      if (dp._measure) dp._measure();\n    };\n    requestAnimationFrame(nudge);\n    setTimeout(nudge, 300);\n  }\n  renderVals() {\n    return {\n      showConfidential: this.props.showConfidential ?? true,\n      showExpansion: this.props.showExpansion ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
